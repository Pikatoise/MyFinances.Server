version: '3.4'

services:
  myfinances.api:
    image: ${DOCKER_REGISTRY-}myfinances.api
    build:
      context: .
      dockerfile: MyFinances.Api/Dockerfile
    ports:
       - "5000:80" 
    depends_on:
        - postgresql_db
        - rabbitmq_broker
    networks:
        - app-network
    env_file:
        - ./.env

  rabbitmq_broker:
    hostname: rabbitmq_broker
    container_name: rabbitmq_broker
    image: rabbitmq:3-management
    environment:
        RABBITMQ_DEFAULT_USER: root
        RABBITMQ_DEFAULT_PASS: root
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - app-network
    volumes: 
      - rabbitmqdata:/var/lib/rabbitmq/

  postgresql_db:
    container_name: postgresql_db
    image: postgres:latest
    environment:
         - POSTGRES_USER=root
         - POSTGRES_PASSWORD=root
         - POSTGRES_DB=MyFinances
    ports:
        - "5432:5432"
    volumes:
        - "pgdata:/var/lib/postgresql/data"
    networks:
        - app-network

networks:
  app-network: {}

volumes:
    pgdata: {}
    rabbitmqdata: {}
